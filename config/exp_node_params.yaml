/**:
  ros__parameters:

    # --- Actuator slices: order defines priority (first = used first) ---
    # Portions do not have to add up to 100%.
    actuator_order: ['shutter', 'gain', 'led']
    shutter_portion: 1.0          # fraction of [0,1] driving shutter
    shutter_max_us: 10000         # shutter range: 0 – 10000 µs
    gain_portion: 0.5             # fraction of [0,1] driving gain
    gain_max: 12.0                # gain range: 0 – 12 dB
    led_portion: 0.0              # 0.0 = LED disabled
    led_max: 0.0                 # LED range: 0 – 40 W

    # --- Optimizer initial state ---
    initial_exposure_level: 0.1   # normalized [0,1] starting point

    # --- Optimizer method: 'simple' | 'gradient' | 'shim' ---
    shutter_update_method: 'gradient'
    optimizer_loop_hz: 20

    # --- Gradient optimizer ---
    grad_k: 0.05

    # --- Simple optimizer ---
    simple_step_size: 0.01        # step per gamma-index unit

    # --- Shim optimizer ---
    shim_update_function: '2018'  # '2014' | '2018'
    kp: 0.02

    # --- Image processing ---
    img_proc_loop_hz: 2
    img_proc_width: 342
    img_proc_height: 408
    startup_delay: 1

    # --- Gamma / curve-fit ---
    curve_fit_method: 'log_quadratic'   # 'quadratic' | 'log_quadratic'
    gamma_range: 2.0
    gamma_num_points: 5
    gamma_x_offset: 0.0

    # --- Soft percentile weighting (Zhang et al. 2017) ---
    softperc_weighting: true      # enable soft percentile gradient weighting
    softperc_percentile: 0.7     # percentile p in [0, 1]; paper recommends 0.7-0.8
    softperc_k: 2.0               # exponent sharpening the bell-shaped weight curve; larger = sharper peak, <1 flattens it
    # softperc_integer_hist: true        # true = histogram sort O(S), false = float sort O(S log S); default: true
    # softperc_trapezoid_approx: false   # true = trapezoidal weight approx O(256) exact = O(S); default: false

    # --- Sweep (debug) ---
    do_sweep: false
    sweep_steps: 100

    # --- Plotter (requires WITH_PLOTTER build flag) ---
    enable_plotter: true
